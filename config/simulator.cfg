# Initial person attributes. Ranges are inclusive and sampled uniformly.
# Age is in years. Other values are 0-100 simulation scales: higher hunger
# and thirst mean greater need; higher sleep means more rested.
age_min = 0
age_max = 100
hp_min = 70
hp_max = 100
hunger_min = 0
hunger_max = 30
thirst_min = 0
thirst_max = 30
sleep_min = 60
sleep_max = 100
genders = Female, Male

